version: "1.1.0"
effective_date: "2026-09-27"
method_name: "Grade + Climate 145-bpm v1.1"

qualification:
  target_hr_bpm: 145
  accepted_hr_min_bpm: 140
  accepted_hr_max_bpm: 150
  min_lap_duration_seconds: 600
  exclude_first_lap: true

heart_rate:
  # Preserved from the site's original calibration.
  speed_coefficient_mps_per_bpm: 0.0116511339

grade:
  model: "Minetti et al. 2002 running energy-cost polynomial"
  valid_grade_min: -0.45
  valid_grade_max: 0.45
  flat_cost_j_per_kg_m: 3.6
  coefficients_descending: [155.4, -30.4, -43.3, 46.3, 19.5, 3.6]

climate:
  metric: "simplified_wbgt"
  vapor_pressure_hpa:
    a: 6.105
    b: 17.27
    c: 237.7
  simplified_wbgt:
    temp_coefficient: 0.567
    vapor_pressure_coefficient: 0.393
    intercept_c: 3.94
  optimal_wbgt_c: 7.5
  heat_speed_penalty_per_c: 0.004
  cold_speed_penalty_per_c: 0.001
  validated_wbgt_min_c: -7.0
  validated_wbgt_max_c: 33.0
  heat_penalty_sensitivity_per_c: [0.002, 0.006]
  calibration:
    type: "personal-history regularized"
    calibration_date: "2026-09-27"
    athlete_scope: "same-location steady aerobic COROS runs"
    high_confidence_weather_matched_runs:
      - date: "2026-09-12"
        adjusted_pace_v1_sec_per_mile: 731
        wbgt_c_approx: 29.3
      - date: "2026-09-22"
        adjusted_pace_v1_sec_per_mile: 720
        wbgt_c_approx: 27.6
      - date: "2026-09-24"
        adjusted_pace_v1_sec_per_mile: 778
        wbgt_c_approx: 29.0
      - date: "2026-09-26"
        adjusted_pace_v1_sec_per_mile: 699
        wbgt_c_approx: 23.8
      - date: "2026-09-27"
        adjusted_pace_v1_sec_per_mile: 747
        wbgt_c_approx: 32.0
    raw_personal_fit_note: "The unconstrained personal slope was materially stronger than 0.4%/C, but the sample is small and confounded by fatigue, time of day, and route-level noise. v1.1 regularizes to 0.4%/C rather than overfitting."
    rationale: "The athlete's residual pace remained slower on hotter matched runs after v1.0 correction. The selected 0.4%/C coefficient is stronger than the prior marathon-only 0.2%/C proxy, is supported by the athlete-specific direction and magnitude, and matches the cross-event heat slope reported by Mantzios et al. 2022."
  notes:
    - "Use measured/full WBGT when trustworthy run-window WBGT is available; otherwise use simplified WBGT."
    - "Store wind speed/direction and solar context for audit, but v1.1 applies no independent wind coefficient."
    - "v1.1 is athlete-specific and regularized; do not treat 0.4%/C as a universal physiological law."
    - "Re-fit after materially more matched runs are available; do not silently change this coefficient without another version bump."

aggregation:
  weighting: "qualifying_lap_duration_seconds"
  metres_per_mile: 1609.344

secondary_metrics:
  version: "1.0.0"
  aerobic_decoupling:
    minimum_qualifying_laps: 2
    source_laps: "same chronological post-warm-up laps that pass the 10-minute and 140-150 bpm qualification rules"
    split: "first half vs second half by qualifying duration"
    efficiency_factor: "duration-weighted Minetti grade-normalized observed speed divided by duration-weighted observed HR"
    climate_note: "A single run-window climate multiplier cancels from the within-run ratio; no separate climate correction is applied to decoupling."
    interpretation: "Positive values indicate efficiency loss in the second half; negative values can occur from pacing/terrain noise or a stronger second half."
    reference_line_percent: 5
  standardized_hr:
    reference_pace_seconds_per_mile: 720
    reference_pace_display: "12:00/mi"
    derivation: "Invert the preserved 0.0116511339 m/s per bpm coefficient from the fully adjusted 145-bpm run pace."
    calibration_hr_min_bpm: 140
    calibration_hr_max_bpm: 150
    extrapolation_policy: "Calculate for continuity but visibly flag values outside 140-150 bpm as extrapolated; do not present as measured HR or a race prediction."
