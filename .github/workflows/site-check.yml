name: Check site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify running calculations
        run: |
          python3 scripts/test_running_adjustment.py
          python3 scripts/test_running_profile.py
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check generated pages and internal links
        run: python3 scripts/check_site.py _site
